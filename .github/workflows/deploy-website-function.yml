name: Deploy website function (Demox EPX2UU43 / slug website)

# 平台站点 EPX2UU43 上的 website 业务函数。
# push 到 master，且只改了这个函数的源码或本 workflow 时，自动推送并切别名。
# workflow_dispatch 只做回滚（数字 version）。
# environment website-function-production：没有 required reviewers，只允许 master。本仓库不改这个 environment。
# 切到 production 之后跑双账号冒烟（易点前门 + DEMOX_SMOKE_LIN_BASE）。
# 失败把 develop 和 production 切回，job 变红，并开 release-failure issue。
# CLI 只推 index.js。公开 https://api.demox.site 跑的是 function-api 进程内的 website，不读这里的别名。
# 冒烟仍打两个前门；失败一样回滚这个函数的别名。
# 令牌只用 secret DEMOX_TOKEN，不进命令行参数。脚本先 ::add-mask::，CLI 输出不打印。
on:
  push:
    branches: [master]
    paths:
      - "scf-code/website-api/index.js"
      - "scf-code/website-api/project-data.js"
      - "scf-code/website-api/package.json"
      - "scf-code/website-api/package-lock.json"
      - "scf-code/website-api/shared/blocked-phrases.json"
      - "scf-code/website-api/shared/buckets.js"
      - "scf-code/website-api/shared/content-scan.js"
      - "scf-code/website-api/shared/cookie-domain-policy.cjs"
      - "scf-code/website-api/shared/crypto.js"
      - "scf-code/website-api/shared/db.js"
      - "scf-code/website-api/shared/deploy-upload.js"
      - "scf-code/website-api/shared/feishu-directory.js"
      - "scf-code/website-api/shared/github-directory.js"
      - "scf-code/website-api/shared/jwt.js"
      - "scf-code/website-api/shared/membership.js"
      - "scf-code/website-api/shared/storage.js"
      - ".github/workflows/deploy-website-function.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "回滚目标版本号（数字）"
        required: true
        type: string

concurrency:
  group: deploy-website-function
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  website-function:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: website-function-production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"

      - name: Unit tests
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          node --test scripts/ci/website-function-release.test.cjs
          npm config set fetch-retries 5
          npm ci --prefix scf-code/website-api --no-audit --no-fund
          node --test scf-code/website-api/*.test.cjs scf-code/website-api/shared/*.test.cjs

      - name: Install Demox CLI
        run: npm install -g @demox-site/cli@1.1.6 --no-audit --no-fund > /dev/null

      - name: Release
        if: github.event_name == 'push'
        env:
          DEMOX_TOKEN: ${{ secrets.DEMOX_TOKEN }}
          DEMOX_SMOKE_EK_BASE: ${{ vars.DEMOX_SMOKE_EK_BASE }}
          DEMOX_SMOKE_LIN_BASE: ${{ vars.DEMOX_SMOKE_LIN_BASE }}
          DEMOX_SMOKE_WEBSITE_ID: ${{ vars.DEMOX_SMOKE_WEBSITE_ID }}
          DEMOX_SMOKE_WWW_MIRROR_URL: ${{ vars.DEMOX_SMOKE_WWW_MIRROR_URL }}
          DEMOX_SMOKE_EMAIL: ${{ secrets.DEMOX_SMOKE_EMAIL }}
          DEMOX_SMOKE_PASSWORD: ${{ secrets.DEMOX_SMOKE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/website-function-release.cjs

      - name: Rollback
        if: github.event_name == 'workflow_dispatch'
        env:
          DEMOX_TOKEN: ${{ secrets.DEMOX_TOKEN }}
          DEMOX_SMOKE_EK_BASE: ${{ vars.DEMOX_SMOKE_EK_BASE }}
          DEMOX_SMOKE_LIN_BASE: ${{ vars.DEMOX_SMOKE_LIN_BASE }}
          DEMOX_SMOKE_WEBSITE_ID: ${{ vars.DEMOX_SMOKE_WEBSITE_ID }}
          DEMOX_SMOKE_WWW_MIRROR_URL: ${{ vars.DEMOX_SMOKE_WWW_MIRROR_URL }}
          DEMOX_SMOKE_EMAIL: ${{ secrets.DEMOX_SMOKE_EMAIL }}
          DEMOX_SMOKE_PASSWORD: ${{ secrets.DEMOX_SMOKE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLBACK_VERSION: ${{ inputs.version }}
        run: node scripts/ci/website-function-release.cjs rollback
