name: Release master

# push master 的唯一自动发布入口。按路径决定跑哪些段，顺序固定：
# function-api → website 函数 → 边缘函数 → www（含刷新缓存和冒烟）。
# 上一段失败，后面不跑。没改到的段跳过，不挡住后面改到的段。
# workflow_dispatch 四段都真跑。
# 子 workflow 不再监听 push，避免同一次推送发布两遍。
on:
  push:
    branches: [master]
    paths:
      - "scf-code/function-api/**"
      - "scf-code/website-api/**"
      - "scf-code/mcp-api/**"
      - "scf-code/cert-renew/**"
      - "scf-deploy-packages/auth-api/**"
      - "scripts/package-unified-scf.mjs"
      - "scripts/ci/scf-function-api.cjs"
      - "scripts/ci/function-api-release.cjs"
      - "scripts/ci/edge-deploy.cjs"
      - "scripts/ci/edge-private-probe.py"
      - "scripts/ci/edge-release-probes.sh"
      - "scripts/generate-seo-pages.mjs"
      - "edge-functions/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "tsconfig*.json"
      - "components.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-function-api.yml"
      - ".github/workflows/deploy-website-function.yml"
      - ".github/workflows/deploy-edge.yml"
      - "scripts/ci/release-changes.py"
  workflow_dispatch:

concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      function_api: ${{ steps.filter.outputs.function_api }}
      website: ${{ steps.filter.outputs.website }}
      edge: ${{ steps.filter.outputs.edge }}
      www: ${{ steps.filter.outputs.www }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - name: Classify paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci/release-changes.py "$EVENT_NAME" >> "$GITHUB_OUTPUT"

  function-api:
    needs: changes
    if: needs.changes.outputs.function_api == 'true'
    uses: ./.github/workflows/deploy-function-api.yml
    secrets: inherit

  website:
    needs: [changes, function-api]
    if: always() && !cancelled() && needs.changes.outputs.website == 'true' && (needs.function-api.result == 'success' || needs.function-api.result == 'skipped')
    uses: ./.github/workflows/deploy-website-function.yml
    secrets: inherit

  edge:
    needs: [changes, function-api, website]
    if: always() && !cancelled() && needs.changes.outputs.edge == 'true' && (needs.function-api.result == 'success' || needs.function-api.result == 'skipped') && (needs.website.result == 'success' || needs.website.result == 'skipped')
    uses: ./.github/workflows/deploy-edge.yml
    with:
      dry_run: false
    secrets: inherit

  www:
    needs: [changes, function-api, website, edge]
    if: always() && !cancelled() && needs.changes.outputs.www == 'true' && (needs.function-api.result == 'success' || needs.function-api.result == 'skipped') && (needs.website.result == 'success' || needs.website.result == 'skipped') && (needs.edge.result == 'success' || needs.edge.result == 'skipped')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
