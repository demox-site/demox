name: Deploy to Demox (self-hosted)

# 主站正式发布：由 release.yml 在 master 上调用，或手动触发。构建 dist/，再用 Demox CLI 原地更新 EPX2UU43。
# 鉴权用 GitHub Environment `www` 的 Secret DEMOX_TOKEN（环境密钥）。不要把 token 写进代码。
# 发布成功后，purge job 用同一 environment 的 OIDC 角色刷新 EdgeOne 缓存。
# 刷新后再做双账号冒烟，并核对 dist/index.html 里的 bundle。冒烟失败开 issue，不自动换回旧静态文件。
# deploy 只有 contents: read；id-token: write 只给 purge。不使用长期密钥。
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-www
  cancel-in-progress: false

env:
  WEBSITE_ID: EPX2UU43
  VITE_DEMOX_API_URL: ${{ vars.VITE_DEMOX_API_URL }}
  VITE_DEMOX_SITE_URL: ${{ vars.VITE_DEMOX_SITE_URL }}
  VITE_DEMOX_SITE_ID: EPX2UU43
  VITE_DEMOX_FUNCTION_ENV: production
  VITE_FEISHU_APP_ID: ${{ vars.VITE_FEISHU_APP_ID }}
  VITE_FEISHU_REDIRECT_URI: ${{ vars.VITE_FEISHU_REDIRECT_URI }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: www
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install & build
        run: |
          : "${VITE_DEMOX_API_URL:?请在 GitHub Actions Variables 中配置 VITE_DEMOX_API_URL}"
          : "${VITE_DEMOX_SITE_URL:?请在 GitHub Actions Variables 中配置 VITE_DEMOX_SITE_URL}"
          : "${VITE_FEISHU_APP_ID:?请在 GitHub Actions Variables 中配置 VITE_FEISHU_APP_ID}"
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Deploy dist with Demox CLI
        env:
          DEMOX_TOKEN: ${{ secrets.DEMOX_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEMOX_TOKEN:-}" ]; then
            echo "::error::缺少 DEMOX_TOKEN secret"; exit 1
          fi
          npm install -g @demox-site/cli@1.1.6
          demox deploy ./dist --id "${WEBSITE_ID}"

      - name: Save index for the bundle check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: www-index-${{ github.run_id }}
          path: dist/index.html
          if-no-files-found: error
          retention-days: 7

  purge:
    needs: deploy
    runs-on: ubuntu-latest
    environment: www
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"

      # 站点已经发布成功。刷新失败不会回滚发布，但会让本 job 失败。
      - name: Purge EdgeOne cache
        timeout-minutes: 8
        env:
          TENCENT_WWW_PURGE_ROLE_ARN: ${{ vars.TENCENT_WWW_PURGE_ROLE_ARN }}
          TENCENT_OIDC_PROVIDER_ID: ${{ vars.TENCENT_OIDC_PROVIDER_ID }}
          EO_ZONE_ID: ${{ vars.EO_ZONE_ID }}
          WWW_ORIGIN_PURGE_PREFIX: ${{ vars.WWW_ORIGIN_PURGE_PREFIX }}
        run: node scripts/ci/www-purge.cjs

  smoke:
    needs: purge
    runs-on: ubuntu-latest
    environment: www
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"

      - name: Download index
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: www-index-${{ github.run_id }}
          path: www-index

      - name: Bundle name
        id: bundle
        run: node scripts/ci/www-bundle.cjs www-index/index.html >> "$GITHUB_OUTPUT"

      - name: Smoke both accounts
        env:
          EXPECT_BUNDLE: ${{ steps.bundle.outputs.bundle }}
          DEMOX_SMOKE_EK_BASE: ${{ vars.DEMOX_SMOKE_EK_BASE }}
          DEMOX_SMOKE_LIN_BASE: ${{ vars.DEMOX_SMOKE_LIN_BASE }}
          DEMOX_SMOKE_WEBSITE_ID: ${{ vars.DEMOX_SMOKE_WEBSITE_ID }}
          DEMOX_SMOKE_WWW_MIRROR_URL: ${{ vars.DEMOX_SMOKE_WWW_MIRROR_URL }}
          DEMOX_SMOKE_EMAIL: ${{ secrets.DEMOX_SMOKE_EMAIL }}
          DEMOX_SMOKE_PASSWORD: ${{ secrets.DEMOX_SMOKE_PASSWORD }}
        run: node scripts/ci/release-smoke.cjs

      - name: Open failure issue
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STAGE: www 冒烟未通过
          RELEASE_ROLLBACK_NOTE: 主站静态文件没有自动换回上一版。
        run: node scripts/ci/open-release-issue.cjs
