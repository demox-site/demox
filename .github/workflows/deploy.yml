name: Deploy to Demox (self-hosted)

# 主站正式发布：push master 后构建 dist/，再用 Demox CLI 原地更新 EPX2UU43。
# 鉴权用 GitHub Environment `www` 的 Secret DEMOX_TOKEN（环境密钥）。不要把 token 写进代码。
# 发布成功后再用同一 environment 的 OIDC 角色刷新 EdgeOne 缓存，不使用长期密钥。
on:
  push:
    branches: [master]
    # 只有前端构建输入变化时才重新发布 www（EPX2UU43）。边缘函数、SCF、文档等改动不触发。
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "tsconfig*.json"
      - "components.json"
      - "scripts/generate-seo-pages.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-www
  cancel-in-progress: true

env:
  WEBSITE_ID: EPX2UU43
  VITE_DEMOX_API_URL: ${{ vars.VITE_DEMOX_API_URL }}
  VITE_DEMOX_SITE_URL: ${{ vars.VITE_DEMOX_SITE_URL }}
  VITE_DEMOX_SITE_ID: EPX2UU43
  VITE_DEMOX_FUNCTION_ENV: production
  VITE_FEISHU_APP_ID: ${{ vars.VITE_FEISHU_APP_ID }}
  VITE_FEISHU_REDIRECT_URI: ${{ vars.VITE_FEISHU_REDIRECT_URI }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: www
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install & build
        run: |
          : "${VITE_DEMOX_API_URL:?请在 GitHub Actions Variables 中配置 VITE_DEMOX_API_URL}"
          : "${VITE_DEMOX_SITE_URL:?请在 GitHub Actions Variables 中配置 VITE_DEMOX_SITE_URL}"
          : "${VITE_FEISHU_APP_ID:?请在 GitHub Actions Variables 中配置 VITE_FEISHU_APP_ID}"
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Deploy dist with Demox CLI
        env:
          DEMOX_TOKEN: ${{ secrets.DEMOX_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEMOX_TOKEN:-}" ]; then
            echo "::error::缺少 DEMOX_TOKEN secret"; exit 1
          fi
          npm install -g @demox-site/cli@1.1.6
          demox deploy ./dist --id "${WEBSITE_ID}"

      # 站点已经发布成功。刷新失败不会回滚发布，但会让本 job 失败。
      - name: Purge EdgeOne cache
        timeout-minutes: 8
        env:
          TENCENT_WWW_PURGE_ROLE_ARN: ${{ vars.TENCENT_WWW_PURGE_ROLE_ARN }}
          TENCENT_OIDC_PROVIDER_ID: ${{ vars.TENCENT_OIDC_PROVIDER_ID }}
          EO_ZONE_ID: ${{ vars.EO_ZONE_ID }}
          WWW_ORIGIN_PURGE_PREFIX: ${{ vars.WWW_ORIGIN_PURGE_PREFIX }}
        run: node scripts/ci/www-purge.cjs
