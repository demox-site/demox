name: Deploy function-api (SCF demox-function-api)

# 统一 SCF 路由 demox-function-api（ap-guangzhou / namespace demox）的发布。
# 只更新代码：不改函数环境变量（里面有 JWT_SECRET 等），也不改内存、超时、VPC。
# push 到 master（路径命中）自动：stage → deploy-develop → develop 双账号冒烟 → promote → production 双账号冒烟。
# 易点和磷都发。DEMOX_EK_ENABLED 不是 true 时失败，不会只发磷。
# 冒烟或切换失败：已经动过的别名切回去，job 变红，并开 release-failure issue。
# workflow_dispatch 只做回滚（磷 version + 易点 version_ek）。
# environment function-api-production：没有 required reviewers，只允许 master。本仓库不改这个 environment。
# OIDC sub 仍是 repo:demox-site/demox:environment:function-api-production。
# 凭证：不用任何腾讯云 secret。临时密钥 1 小时，只留在进程内存里。
# 角色只能对 codename=demox 的函数换代码/发版本/切别名。健康检查走公网 HTTPS，不用 Invoke。
on:
  push:
    branches: [master]
    paths:
      - "scf-code/function-api/**"
      - "scf-code/website-api/**"
      - "scf-code/mcp-api/**"
      - "scf-code/cert-renew/**"
      - "scf-deploy-packages/auth-api/**"
      - "scripts/package-unified-scf.mjs"
      - "scripts/ci/scf-function-api.cjs"
      - "scripts/ci/function-api-release.cjs"
      - ".github/workflows/deploy-function-api.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "回滚：磷的目标版本号（数字）"
        required: true
        type: string
      version_ek:
        description: "回滚：易点的目标版本号（数字）"
        required: true
        type: string

# 同一时间只跑一个，且不取消正在进行的发布（切一半被取消比排队更危险）。
concurrency:
  group: deploy-function-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  function-api:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: function-api-production
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install tooling
        run: |
          npm config set fetch-retries 5
          npm install --legacy-peer-deps --no-audit --no-fund
          npm ci --prefix scf-code/function-api --omit=dev --no-audit --no-fund
          npm ci --prefix scf-code/cert-renew --omit=dev --no-audit --no-fund

      - name: Unit tests (deploy script + function-api)
        if: github.event_name == 'push'
        run: |
          node --test scripts/ci/scf-function-api.test.cjs scripts/ci/function-api-release.test.cjs
          node --test scripts/ci/function-versions.test.cjs scripts/ci/reproducible-zip.test.mjs
          npm test --prefix scf-code/function-api

      - name: Build unified package
        if: github.event_name == 'push'
        run: |
          node scripts/package-unified-scf.mjs --apply > /tmp/unified-manifest.json
          node -e "const m=require('/tmp/unified-manifest.json');console.log('zip', m.artifact.sizeBytes, 'bytes sha256', m.artifact.sha256)"
          # Web 函数（demox-api-web）用同一个包启动，必须带可执行的 scf_bootstrap；缺了就别发。
          unzip -Z .artifacts/unified-scf/demox-unified-scf.zip | grep -E '^-rwx.* scf_bootstrap$' \
            || { echo "::error::统一包缺少可执行的 scf_bootstrap"; exit 1; }

      - name: Release
        if: github.event_name == 'push'
        env:
          # 磷（UIN 100021031865）：备源站。入口是 SCF 自定义域名。
          LIN_ROLE_ARN: qcs::cam::uin/100021031865:roleName/demox-ci-deploy
          LIN_COS_BUCKET: ${{ vars.DEMOX_COS_BUCKET }}
          LIN_COS_REGION: ${{ vars.DEMOX_COS_REGION }}
          LIN_COS_ACCELERATE: ${{ vars.DEMOX_COS_ACCELERATE }}
          LIN_DEVELOP_URL: ${{ vars.FUNCTION_API_DEVELOP_URL }}
          # 易点（UIN 100052992193）：主源站。入口是函数 HTTP 触发器。
          EK_ENABLED: ${{ vars.DEMOX_EK_ENABLED }}
          EK_ROLE_ARN: ${{ vars.DEMOX_EK_ROLE_ARN }}
          EK_COS_BUCKET: ${{ vars.DEMOX_EK_COS_BUCKET }}
          EK_COS_REGION: ${{ vars.DEMOX_EK_COS_REGION }}
          EK_COS_ACCELERATE: ${{ vars.DEMOX_EK_COS_ACCELERATE }}
          EK_DEVELOP_URL: ${{ vars.FUNCTION_API_DEVELOP_URL_EK }}
          TENCENTCLOUD_REGION: ap-guangzhou
          RELEASE_LOG: docs/function-releases.jsonl
          DEMOX_SMOKE_EK_BASE: ${{ vars.DEMOX_SMOKE_EK_BASE }}
          DEMOX_SMOKE_LIN_BASE: ${{ vars.DEMOX_SMOKE_LIN_BASE }}
          DEMOX_SMOKE_WEBSITE_ID: ${{ vars.DEMOX_SMOKE_WEBSITE_ID }}
          DEMOX_SMOKE_WWW_MIRROR_URL: ${{ vars.DEMOX_SMOKE_WWW_MIRROR_URL }}
          DEMOX_SMOKE_EMAIL: ${{ secrets.DEMOX_SMOKE_EMAIL }}
          DEMOX_SMOKE_PASSWORD: ${{ secrets.DEMOX_SMOKE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/function-api-release.cjs

      - name: Rollback
        if: github.event_name == 'workflow_dispatch'
        env:
          LIN_ROLE_ARN: qcs::cam::uin/100021031865:roleName/demox-ci-deploy
          LIN_COS_BUCKET: ${{ vars.DEMOX_COS_BUCKET }}
          LIN_COS_REGION: ${{ vars.DEMOX_COS_REGION }}
          LIN_COS_ACCELERATE: ${{ vars.DEMOX_COS_ACCELERATE }}
          LIN_DEVELOP_URL: ${{ vars.FUNCTION_API_DEVELOP_URL }}
          EK_ENABLED: ${{ vars.DEMOX_EK_ENABLED }}
          EK_ROLE_ARN: ${{ vars.DEMOX_EK_ROLE_ARN }}
          EK_COS_BUCKET: ${{ vars.DEMOX_EK_COS_BUCKET }}
          EK_COS_REGION: ${{ vars.DEMOX_EK_COS_REGION }}
          EK_COS_ACCELERATE: ${{ vars.DEMOX_EK_COS_ACCELERATE }}
          EK_DEVELOP_URL: ${{ vars.FUNCTION_API_DEVELOP_URL_EK }}
          TENCENTCLOUD_REGION: ap-guangzhou
          ROLLBACK_VERSION: ${{ inputs.version }}
          EK_VERSION: ${{ inputs.version_ek }}
        run: node scripts/ci/function-api-release.cjs rollback
