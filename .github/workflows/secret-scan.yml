name: secret-scan

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tgz
          gitleaks version

      # 全部历史：只放过 .gitleaks.toml 里的 f78c530 和 .gitleaksignore 里的两条已知占位
      - name: Scan git history (blocking)
        run: gitleaks git --redact --no-banner --exit-code 1 -c .gitleaks.toml .

      # 当前代码：包括还没进历史的文件
      - name: Scan working tree (blocking)
        run: gitleaks dir --redact --no-banner --exit-code 1 -c .gitleaks.toml .
