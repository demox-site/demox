<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 · 站点未发布</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #111;
    background: #f7f7f5;
  }
  .wrap { width: min(480px, 100%); text-align: center; }
  .kicker {
    margin: 0 0 16px;
    color: #71717a;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  h1 { margin: 0 0 12px; font-size: 36px; letter-spacing: -.03em; }
  p { margin: 0 0 12px; color: #52525b; }
  .btn {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 22px;
    border-radius: 12px;
    background: #111;
    color: #fff;
    font-weight: 650;
    text-decoration: none;
  }
  .brand { margin-top: 32px; color: #71717a; font-size: 12px; }
  .brand a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">404</p>
  <h1>站点未发布</h1>
  <p>这个地址还没有站点。它可能已被删除、尚未部署，或域名写错了。</p>
  <a class="btn" href="https://www.demox.site/">打开 Demox</a>
  <p class="brand">Published with <a href="https://www.demox.site/">Demox</a></p>
</div>
</body>
</html>
