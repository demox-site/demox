<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>晚风番茄钟 · 专注 25 分钟</title>
<meta name="description" content="一个单文件的番茄钟小工具：专注、短休、长休，带今日记录。Demox 公开示例。">
<style>
:root{--bg:#1d2433;--ink:#f4efe6;--mute:#9aa3b5;--acc:#ff8a5b;--card:#252e40}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#33405a,var(--bg));color:var(--ink);font:15px/1.6 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;display:flex;flex-direction:column;align-items:center}
header{width:min(920px,92vw);display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font-weight:700;letter-spacing:.04em}.logo b{color:var(--acc)}
header small{color:var(--mute)}
main{width:min(920px,92vw);display:grid;grid-template-columns:1.3fr 1fr;gap:22px;margin-top:10px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:22px;padding:28px}
.modes{display:flex;gap:8px;margin-bottom:18px}
.modes button{flex:1;border:0;border-radius:999px;padding:9px;background:rgba(255,255,255,.06);color:var(--mute);font:inherit;cursor:pointer}
.modes button.on{background:var(--acc);color:#1d2433;font-weight:600}
.dial{position:relative;width:min(300px,70vw);aspect-ratio:1;margin:8px auto 18px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time b{font:600 64px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:-.02em}.time span{color:var(--mute);margin-top:6px}
.ctl{display:flex;gap:10px;justify-content:center}
.ctl button{border:0;border-radius:14px;padding:12px 26px;font:600 15px system-ui;cursor:pointer}
.go{background:var(--ink);color:#1d2433}.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.18)!important}
h2{font-size:15px;margin:0 0 12px;color:var(--mute);font-weight:500}
.today{display:flex;gap:6px;flex-wrap:wrap;min-height:28px}.today i{width:22px;height:22px;border-radius:50%;background:var(--acc);opacity:.9}
.today em{color:var(--mute);font-style:normal}
label{display:flex;justify-content:space-between;align-items:center;margin:12px 0;color:var(--ink)}
input[type=range]{width:55%;accent-color:var(--acc)}
.tip{margin-top:18px;padding:14px;border-radius:14px;background:rgba(255,138,91,.08);color:#ffd2bf;font-size:14px}
footer{color:var(--mute);font-size:13px;padding:30px 0}
@media(max-width:760px){main{grid-template-columns:1fr}.time b{font-size:52px}}
</style></head><body>
<header><div class="logo">晚风<b>·</b>番茄钟</div><small>单文件 HTML · 数据只存在你的浏览器</small></header>
<main>
 <section class="card">
  <div class="modes"><button class="on" data-m="focus">专注</button><button data-m="short">短休</button><button data-m="long">长休</button></div>
  <div class="dial"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="8"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="#ff8a5b" stroke-width="8" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg>
   <div class="time"><b id="t">25:00</b><span id="lab">专注一段</span></div></div>
  <div class="ctl"><button class="go" id="go">开始</button><button class="ghost" id="rs">重置</button></div>
 </section>
 <aside class="card">
  <h2>今天完成</h2><div class="today" id="today"><em>还没有，先来一个。</em></div>
  <h2 style="margin-top:22px">时长（分钟）</h2>
  <label>专注 <input type="range" min="10" max="60" value="25" id="r-focus"><span id="v-focus">25</span></label>
  <label>短休 <input type="range" min="3" max="15" value="5" id="r-short"><span id="v-short">5</span></label>
  <label>长休 <input type="range" min="10" max="30" value="15" id="r-long"><span id="v-long">15</span></label>
  <div class="tip">每完成 4 个专注，建议来一次长休。按空格键开始 / 暂停。</div>
 </aside>
</main>
<footer>晚风番茄钟 · Demox 公开示例：一个 AI 写好的单页小工具，<code>demox deploy ./tool</code> 发布。</footer>
<script>
var D={focus:25,short:5,long:15},L={focus:'专注一段',short:'起来走走',long:'好好休息'},m='focus',left=D.focus*60,tot=left,run=null;
var $=function(i){return document.getElementById(i)},key='wf-'+new Date().toDateString();
function show(){var mm=Math.floor(left/60),ss=left%60;$('t').textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;$('arc').style.strokeDashoffset=326.7*(1-left/tot);document.title=$('t').textContent+' · 晚风番茄钟';}
function today(){var n=+(localStorage.getItem(key)||0),el=$('today');el.innerHTML=n?Array(n+1).join('<i></i>'):'<em>还没有，先来一个。</em>';}
function set(x){m=x;stop();left=tot=D[m]*60;$('lab').textContent=L[m];document.querySelectorAll('.modes button').forEach(function(b){b.classList.toggle('on',b.dataset.m===m)});show();}
function stop(){clearInterval(run);run=null;$('go').textContent='开始';}
function go(){if(run){stop();return;}$('go').textContent='暂停';run=setInterval(function(){left--;if(left<=0){stop();if(m==='focus'){localStorage.setItem(key,+(localStorage.getItem(key)||0)+1);today();}set(m==='focus'?'short':'focus');return;}show();},1000);}
document.querySelectorAll('.modes button').forEach(function(b){b.onclick=function(){set(b.dataset.m)}});
['focus','short','long'].forEach(function(k){$('r-'+k).oninput=function(e){D[k]=+e.target.value;$('v-'+k).textContent=D[k];if(k===m&&!run)set(m);}});
$('go').onclick=go;$('rs').onclick=function(){set(m)};
addEventListener('keydown',function(e){if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();go();}});
show();today();
</script></body></html>
