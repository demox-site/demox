    <script>
      // Apply the persisted/system theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem("app_theme");
          var theme = saved === "light" || saved === "dark" || saved === "system" ? saved : "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
      // 兼容旧 CLI 的 hash 鉴权链接（/#/mcp-authorize?... → /mcp-authorize?...）
      (function () {
        try {
          var hash = window.location.hash || "";
          var match = hash.match(/^#\/(mcp-authorize|mcp-login)(\?.*)?$/);
          if (!match) return;
          var path = "/" + match[1] + (match[2] || "");
          window.location.replace(window.location.origin + path);
        } catch (e) {}
      })();
    </script>

          <p class="fallback-summary"><strong>直接答案：</strong>静态页面把单个 HTML，或根目录含 <code>index.html</code> 的 dist、build、ZIP 上传到 Demox，获得带 HTTPS 和 CDN 的链接。Node 后端改成 <code>handler(request, env)</code> 后走 <code>demox functions push</code>。网页、CLI、MCP 和 API 都可以。</p>

          <section lang="zh-CN">
            <h2>Demox 是什么？</h2>
            <p>Demox 把 HTML、静态构建目录、ZIP 或文档变成可分享的 HTTPS 站点，并把 Node handler 作为云函数挂到同一站点。它适合前端 Demo、AI 生成页面、客户评审、文档页，以及已改成 handler 的 Node 接口。Python、PHP、Java、Express listen，以及必须直连私密数据库或常驻进程的服务，仍需独立后端或先改造。</p>
          </section>
          <section lang="en">
            <h2>What is Demox?</h2>
            <p>Demox turns an HTML file, static build, ZIP, or document into a shareable HTTPS site, and hosts Node handler(request, env) functions on the same site through the web console, CLI, MCP, or API.</p>
